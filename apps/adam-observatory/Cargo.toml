[package]
name = "adam-observatory"
description = "Bevy observatory client for the authoritative A.D.A.M simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adam-content = { path = "../../crates/adam-content" }
adam-core = { path = "../../crates/adam-core" }

[dependencies.bevy]
version = "0.16.1"
default-features = false
features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
]

# Bevy's default features are disabled above, so `bevy_winit` ships without a
# Linux windowing backend unless one is requested explicitly. Without this the
# workspace fails to compile on Linux CI with `no PlatformIcon in platform_impl`.
[target.'cfg(target_os = "linux")'.dependencies.bevy]
version = "0.16.1"
default-features = false
features = ["x11", "wayland"]

[lints]
workspace = true
