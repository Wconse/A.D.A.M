# A.D.A.M content schema v9.
# Stage 0 demo: two contrasting Arcadian stories plus the separate country of
# Borealia, all under the 20% final-sales tax.
# All money values are minor units; all quantities are milli-units (1000 = 1.0).
schema_version = 9

[scenario]
start_year = 2026
start_day = 1

[[countries]]
id = 1
name = "Arcadia"

[[countries]]
id = 2
name = "Borealia"

[[goods]]
id = 1
name = "Grain"

[[goods]]
id = 2
name = "Bread"

[[consumption_profiles]]
id = 1
name = "Households"

# One need - being fed - with two ways of meeting it. Bread is what a
# household wants; raw grain is what it chews when the bakery has nothing
# left. A month of grain takes 1.8 units per person against 1.0 of bread,
# because unbaked grain feeds a person worse, and the baker turns 1.0 of
# grain into 2.0 of bread. Eating the harvest raw therefore costs the region
# 3.6 times the grain that eating bread would, which is the whole reason a
# starving Eastport competes with its own bakery for the same sacks.
[[consumption_profiles.targets]]
good = 2
tier = "survival"
basis = "per_person"
quantity_milli = 1000
need_group = 1
preference = 0

[[consumption_profiles.targets]]
good = 1
tier = "survival"
basis = "per_person"
quantity_milli = 1800
need_group = 1
preference = 1

